name: Inference tooling

on:
  pull_request:
    paths:
      - ".github/workflows/inference-tooling.yaml"
      - "inference/**"
      - "Makefile"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inference-tooling.yaml"
      - "inference/**"
      - "Makefile"

permissions:
  contents: read

jobs:
  verify:
    name: Static and unit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install reporting dependencies
        run: |
          python -m venv inference/.venv
          inference/.venv/bin/python -m pip install \
            --disable-pip-version-check --no-input \
            -r inference/reporting/requirements.txt

      - name: Check shell scripts
        run: |
          find inference -type f -name '*.sh' -print0 | xargs -0 bash -n
          find inference -type f -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Run shell tests
        run: |
          bash inference/provisioning/gke/tests/test-provisioning.sh
          bash inference/provisioning/gke/tests/test-run-gke-campaign.sh
          bash inference/provisioning/gke/tests/test-run-gke-smoke.sh
          bash inference/suites/llm-d-benchmark/tests/test-cleanup-gke-campaign.sh
          bash inference/suites/llm-d-benchmark/tests/test-run-benchmark.sh

      - name: Run Python tests
        run: |
          inference/.venv/bin/python -m unittest discover \
            -s inference/reporting/tests -p 'test_*.py'
          inference/.venv/bin/python -m unittest discover \
            -s inference/suites/llm-d-benchmark/tests -p 'test_*.py'

      - name: Check standalone-repository references
        run: |
          if git grep -n -E \
              'make -C controller|\.\./inference|gw-api-crds|gie-crds|CONFORMANCE_(CHANNEL|VERSION)' \
              -- Makefile README.md inference; then
            echo "found a stale standalone-repository reference" >&2
            exit 1
          fi
